<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fbf6ec" />
<meta name="description" content="A little birthday surprise for Rhutvi." />
<title>Happy Birthday, Rhutvi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:wght@300;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream: #fbf6ec;
    --rose-soft: #f3c3cc;
    --rose-deep: #c1506b;
    --gold: #cfa24b;
    --ink: #4a3b3e;
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
    background: radial-gradient(circle at 50% 0%, #eef4e9 0%, var(--cream) 45%, #fcedf0 100%);
    font-family: 'Fraunces', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .scene{
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  /* ---------- Flower ---------- */
  .flower-btn{
    background: none;
    border: none;
    padding: 12px;
    margin: 0 auto;
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .flower-btn:focus-visible{
    outline: 2px solid var(--rose-deep);
    outline-offset: 6px;
    border-radius: 50%;
  }

  .flower{
    position: relative;
    width: min(52vw, 200px);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }
  .scene:not(.bloom) .flower{
    animation: breathe 2.6s ease-in-out infinite;
  }

  @keyframes breathe{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.06); }
  }

  .petal-wrap{
    position: absolute;
    inset: 0;
  }
  .petal{
    position: absolute;
    left: 50%;
    top: 4%;
    width: 23%;
    height: 46%;
    border-radius: 50%;
    transform: translateX(-50%) scaleY(0.14);
    transform-origin: 50% 100%;
    background: linear-gradient(180deg, var(--rose-soft), var(--rose-deep));
    transition: transform 1.4s cubic-bezier(.33,1.4,.4,1);
  }
  .petal-wrap:nth-child(even) .petal{
    background: linear-gradient(180deg, #f8d6dc, var(--rose-soft));
  }
  .scene.bloom .petal{ transform: translateX(-50%) scaleY(1); }

  .flower-center{
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6da, var(--gold));
    box-shadow: 0 2px 10px rgba(207,162,75,.45);
    transform: translate(-50%, -50%) scale(.45);
    transition: transform 1s ease .35s;
  }
  .scene.bloom .flower-center{ transform: translate(-50%, -50%) scale(1); }

  /* ---------- Text ---------- */
  .text-block{
    margin-top: 18px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.1s ease .9s, transform 1.1s ease .9s;
  }
  .scene.bloom .text-block{ opacity: 1; transform: translateY(0); }

  .headline{
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(26px, 6.5vw, 34px);
    margin: 0;
    letter-spacing: .2px;
  }
  .name{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(52px, 16vw, 78px);
    line-height: .95;
    margin: -6px 0 4px;
    color: var(--rose-deep);
  }
  .line1{
    font-size: 16.5px;
    font-weight: 500;
    margin: 0 0 10px;
  }
  .line2{
    font-size: 14.5px;
    font-weight: 300;
    line-height: 1.6;
    color: #6b5459;
    max-width: 280px;
    margin: 0 auto 16px;
  }
  .sign{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 26px;
    color: var(--rose-deep);
    margin: 0 0 20px;
  }
  .hint{
    font-size: 12.5px;
    color: #967d82;
    margin: 0;
  }

  .burst-petal{
    position: fixed;
    width: 9px;
    height: 15px;
    border-radius: 50%;
    background: var(--rose-soft);
    opacity: 1;
    pointer-events: none;
    z-index: 30;
    transition: transform 1.3s cubic-bezier(.25,.65,.35,1), opacity 1.3s ease;
  }

  @media (prefers-reduced-motion: reduce){
    .flower, .petal, .flower-center, .text-block, .burst-petal{
      transition-duration: .01ms !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <button class="flower-btn" id="flowerBtn" aria-label="Reveal a few more petals">
      <div class="flower">
        <div class="petal-wrap" style="transform: rotate(0deg)"><div class="petal"></div></div>
        <div class="petal-wrap" style="transform: rotate(60deg)"><div class="petal"></div></div>
        <div class="petal-wrap" style="transform: rotate(120deg)"><div class="petal"></div></div>
        <div class="petal-wrap" style="transform: rotate(180deg)"><div class="petal"></div></div>
        <div class="petal-wrap" style="transform: rotate(240deg)"><div class="petal"></div></div>
        <div class="petal-wrap" style="transform: rotate(300deg)"><div class="petal"></div></div>
        <div class="flower-center"></div>
      </div>
    </button>

    <div class="text-block">
      <h1 class="headline">Happy Birthday</h1>
      <p class="name">Rhutvi</p>
      <p class="line1">Enjoy your day — it's all yours.</p>
      <p class="line2">Here's to another year of your laugh, your light, and being my favourite person.</p>
      <p class="sign">— Krish</p>
      <p class="hint">tap the flower for more ✿</p>
    </div>
  </div>

<script>
  const scene = document.getElementById('scene');
  const flowerBtn = document.getElementById('flowerBtn');

  function petalBurst(){
    const rect = flowerBtn.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    const colors = ['#f3c3cc', '#c1506b', '#f8d6dc'];
    for(let i = 0; i < 10; i++){
      const p = document.createElement('div');
      p.className = 'burst-petal';
      p.style.left = originX + 'px';
      p.style.top = originY + 'px';
      p.style.background = colors[i % colors.length];
      document.body.appendChild(p);
      const angle = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 80;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;
      const rot = Math.random() * 320 - 160;
      requestAnimationFrame(() => {
        p.style.transform = 'translate(' + dx + 'px, ' + (dy + 130) + 'px) rotate(' + rot + 'deg)';
        p.style.opacity = '0';
      });
      setTimeout(() => p.remove(), 1400);
    }
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      scene.classList.add('bloom');
      setTimeout(petalBurst, 700);
    }, 1300);
  });

  flowerBtn.addEventListener('click', petalBurst);
</script>
</body>
</html>
